<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    
    <!-- SEO Meta Tags -->
    <title>FeedSense — AI-Powered College Feedback Analyzer</title>
    <meta name="description" content="FeedSense is an AI/ML-powered college feedback analyzer that helps students, teachers, and administrators gain meaningful insights from academic feedback using sentiment analysis." />
    <meta name="keywords" content="college feedback, student feedback, teacher evaluation, sentiment analysis, AI feedback, FeedSense" />
    <meta name="author" content="FeedSense Team" />
    
    <!-- Open Graph / Social Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://feedsense.edu/" />
    <meta property="og:title" content="FeedSense — AI-Powered College Feedback Analyzer" />
    <meta property="og:description" content="Transform student feedback into actionable insights with AI-powered sentiment analysis. Built for modern colleges." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="FeedSense" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://feedsense.edu/" />
    <meta name="twitter:title" content="FeedSense — AI College Feedback Analyzer" />
    <meta name="twitter:description" content="Transform student feedback into actionable insights with AI-powered sentiment analysis." />
    <meta name="twitter:image" content="/og-image.png" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Security Headers (via meta tags as fallback) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
